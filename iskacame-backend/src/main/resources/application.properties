spring.application.name=iskacame-backend
server.port=8090
spring.profiles.active=local-pg

jwt.secret=${JWT_SECRET_KEY}
jwt.expiration.ms=${JWT_EXPIRATION_MS}

encryption.algorithm=AES
encryption.secret.key=${ENCRYPTION_SECRET_KEY}

cloudinary.cloud_name=${CLOUDINARY_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.debug=true

verification.token.expiration-time=${VERIFICATION_TOKEN_EXPIRATION_MS}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

rabbitmq.host=${RABBITMQ_HOST:localhost}
rabbitmq.port=${RABBITMQ_PORT:61613}
rabbitmq.username=${RABBITMQ_USERNAME:user}
rabbitmq.password=${RABBITMQ_PASSWORD:password}

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.chat.options.google-search-retrieval=true
spring.ai.google.genai.chat.options.temperature=0.7